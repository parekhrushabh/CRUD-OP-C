<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Booking</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            font-family: 'Poppins', sans-serif;
        }
        .card {
            border-radius: 20px;
        }
        .form-control {
            border-radius: 10px;
        }
        .btn-custom {
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg p-4">
                
                <h3 class="text-center mb-4 text-primary">🚗 Car Booking Form</h3>

                <form method="POST">
                    {% csrf_token %}

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" value="{{up.name}}" class="form-control" placeholder="Enter your name" required>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" value="{{up.email}}" class="form-control" placeholder="Enter email" required>
                    </div>

                    <!-- Phone -->
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="phone_no" value="{{up.phone_no}}" class="form-control" placeholder="Enter phone number" required>
                    </div>

                    <!-- Company -->
                    <div class="mb-3">
                        <label class="form-label">Car Company</label>
                        <input type="text" name="company_name" value="{{up.company_name}}" class="form-control" placeholder="e.g. Toyota, Hyundai">
                    </div>

                    <!-- Model -->
                    <div class="mb-3">
                        <label class="form-label">Car Model</label>
                        <input type="text" name="model_name" value="{{up.model_name}}" class="form-control" placeholder="e.g. Swift, i20">
                    </div>

                    <!-- Address -->
                    <div class="mb-3">
                        <label class="form-label">Pickup Address</label>
                        <textarea name="address" class="form-control" rows="3" placeholder="Enter pickup location">{{up.address}}</textarea>
                    </div>

                    <!-- Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg btn-custom">
                            🚀 Book Now
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>
</div>

</body>
</html>
